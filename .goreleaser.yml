# Release build for the Terraform Registry: zipped binaries per platform, a
# SHA256SUMS file signed with our GPG key, and the registry manifest.
# release.yml runs this when a v* tag is pushed.
version: 2
before:
  hooks:
    - go mod tidy
builds:
- env:
    # Static binaries, so they run anywhere Terraform does without system libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
    - s390x
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: darwin
      goarch: s390x
    - goos: freebsd
      goarch: s390x
    - goos: windows
      goarch: arm
    - goos: windows
      goarch: s390x
  # The registry expects terraform-provider-<name>_v<version>.
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  # Our license and the third-party notices and license texts go in every zip.
  files:
    - LICENSE
    - README.md
    - CHANGELOG.md
    - THIRD_PARTY_NOTICES.md
    - THIRD_PARTY_LICENSES
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # --batch because CI has no terminal to prompt in.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set by release.yml from the imported key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
